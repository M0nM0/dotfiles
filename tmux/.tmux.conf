
#################################################
#
#  BASIC Setting
#

#  256色端末 + True Color (24bit)
set -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB'

#
#  Prefix キーを Ctrl-b から Ctrl-j に変更
#
set -g prefix C-j
unbind C-b

set -g base-index 1         # ウィンドウの番号を 1 から開始
setw -g pane-base-index 1   # ペインの番号を 1 から開始

set-option -g renumber-windows on   # ウィンドウを閉じた時に番号を詰める

set -s escape-time 0
unbind -T copy-mode MouseDragEnd1Pane

# copy-mode-vi のマウス関連バインディング
# マウスドラッグ終了時：自動コピーなし、選択状態のみ維持
unbind -T copy-mode-vi MouseDragEnd1Pane
# マウスボタン1解除時：選択を維持して、モード継続
unbind -T copy-mode-vi MouseUp1Pane

# OSC52 clipboard integration for SSH and remote sessions
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
set -as terminal-features ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Note: xclip-based copy/paste removed in favor of OSC52
# OSC52 works over SSH and is supported by modern terminal emulators
# (WezTerm, iTerm2, Alacritty, kitty, etc.)

# set-option -g status-left '#[fg=cyan,bg=#303030]#{?client_prefix,#[reverse],} #H[#S] #[default]'

# Clear screen and scroll-back (Prefix + X)
bind-key -T prefix X send-keys C-l \; send-keys -R \; clear-history

# message表示時のstatus lineの色。dispaly,confirm-before -p などのコマンド出力の色
set -g message-style fg=colour68,reverse,bg=brightwhite

# paneを区切っている線の色
set -g pane-active-border-style fg=colour111,bg=colour236
set -g pane-border-style fg=colour111,bg=colour236

# シェル環境を引き継ぐ（新規ウィンドウ/ペインで最新PATHを使用）
set-option -ga update-environment 'PATH'

# Shell
# default-command 指定で pane が非ログインシェルになる（path_helper による PATH 並べ替えを回避）
set-option -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

#################################################
#
#  KEY BINDING Setting
#

#  Prefix + vim のキーバインドでペインを移動する
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

#  Prefix + vim のキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R 5

#  vimのコピーを適用
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Copy mode を高速起動 (Prefix + v)
bind v copy-mode

unbind -n C-o

bind -r C-h select-window -t :-     # Prefix + Ctrl-h でウィンドウ切り替え
bind -r C-l select-window -t :+     # Prefix + Ctrl-l でウィンドウ切り替え

bind c new-window -a -c '#{pane_current_path}'       # Prefix + c で現在のウィンドウの次に新規ウィンドウを作成
bind | split-window -h -c '#{pane_current_path}'    # Prefix + | でペインを垂直分割する
bind - split-window -v -c '#{pane_current_path}'    # Prefix + - でペインを水平分割する


# 設定ファイルをリロード
bind-key -T prefix R source-file "${HOME}/.tmux.conf" \; display-message 'Reloard was successful.'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 現在のセッション内のウィンドウを切り替え (Prefix + w)
bind-key -T prefix w run-shell "${HOME}/.tmux/scripts/window-current.sh switch"

# Window rename (Prefix + r)
bind-key -T prefix r command-prompt -I "#W" "rename-window '%%'"

# マウスを有効化
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# if session has > 1 windows in current, kill-pane without confirmation.
# But confirm before killing pane when it is the last  pane in the last window.
bind -n M-w if "tmux display -p \"#{session_windows}\" | grep ^1\$ && tmux display -p \"#{window_panes}\" | grep ^1\$" \
    "confirm-before -p \"Kill the only pane in the only window? It will kill this session too. (y/n)\" kill-pane" \
    "kill-pane"

# for neovim
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

#################################################
#
#  STATUS BAR Setting
#

set-option -g status-position top       # ステータスバーをトップに配置する
# continuum の自動保存は status-right の再描画に相乗りしている（0 にすると止まる）
set -g status-interval 30
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

#  Length
set -g status-left-length 90
set -g status-right-length 90

#  Contents
set -g status-style 'fg=brightwhite,bg=colour238'

#  left:マシン名[ペイン番号]
set -g status-left '#[fg=brightwhite, bg=colour111, bold] #(${HOME}/.tmux/scripts/ssh_hostname.sh)#S #[fg=colour111, bg=colour238]'

#  right: prefix インジケーター オンライン状態 日時
#  先頭の continuum_save.sh は自動保存の実行本体。消すと自動保存が止まる
set -g status-right "#(${HOME}/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{prefix_highlight}#[fg=colour111, bg=colour238]#[fg=brightwhite, bg=colour111, bold] #{online_status} #[fg=colour238, bg=colour111] #[fg=colour111, bg=colour238]#[fg=brightwhite, bg=colour111] %m/%d(%a) %H:%M "


# Window Status
setw -g window-status-separator "" # window間の隙間を排除
set-option -g status-justify 'left'   # window-status を左寄せ
# 非アクティブウィンドウ
setw -g window-status-format '#[fg=colour238, bg=brightblack]#[fg=brightwhite, bg=brightblack, bold] ⌘#I #W #[fg=brightblack, bg=colour238]'
# アクティブウィンドウ
setw -g window-status-current-format '#[fg=colour238, bg=colour68]#[fg=brightwhite, bg=colour68, bold] ⌘#I #W #[fg=colour68, bg=colour238]'

#################################################
#
#  PANE Setting
#

#  ベーシックペイン
set -g window-style 'fg=white'

#  アクティブペイン
set -g window-active-style 'fg=white'

#################################################
#
#  PLUGIN Setting
#

# TMUX Plugin Manager Path
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Key bindings
# prefix + I: Installs new plugins from GitHub or any other git repository
# prefix + U: updates plugin(s)
# prefix + option + u: remove/uninstall plugins not on the plugin list

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-online-status'  # https://github.com/tmux-plugins/tmux-online-status
set -g @online_icon '●'
set -g @offline_icon '○'
set -g @plugin 'jaclu/tmux-menus' # https://github.com/jaclu/tmux-menus
# 未設定だと起動時に "invalid option" が出るため明示
set -g @menus_use_cache 'Yes'

set -g @plugin 'tmux-plugins/tmux-resurrect' # https://github.com/tmux-plugins/tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'  # ペインのスクロールバックも保存
set -g @resurrect-strategy-nvim 'session'     # nvim は Session.vim 経由で復元
#  保存先: ${XDG_DATA_HOME:-~/.local/share}/tmux/resurrect

set -g @plugin 'tmux-plugins/tmux-continuum' # https://github.com/tmux-plugins/tmux-continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
#  'on' は Terminal.app を開く LaunchAgent を仕込む（自動保存/復元とは別機能）
set -g @continuum-boot 'off'

set -g @plugin 'sainnhe/tmux-fzf'
# fzf ポップアップのサイズを大きく、プレビューウィンドウを右70%に設定
TMUX_FZF_OPTIONS="-p -w 95% -h 90% -m --preview-window=right:70%:wrap"

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_fg 'colour111'
set -g @prefix_highlight_bg 'colour238'


# https://github.com/tmux-plugins/tpm
# 自動TPMインストール（公式推奨）
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


