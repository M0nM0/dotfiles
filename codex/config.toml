model_reasoning_effort = "medium"
hide_agent_reasoning = true

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"

notify = ["bash", "-lc", "afplay /System/Library/Sounds/Ping.aiff"]
personality = "pragmatic"
model = "gpt-5.6-sol"
service_tier = "default"

[sandbox_workspace_write]
network_access = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = [
  "AWS_*",
  "GH_TOKEN",
  "GITHUB_TOKEN",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "*SECRET*",
  "*TOKEN*",
  "*KEY*",
]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[projects."/Users/momonga/Documents/driver"]
trust_level = "trusted"

[projects."/Users/momonga/Documents/rubykaigi2026-bootcamp/bootcamp"]
trust_level = "trusted"

[projects."/Users/momonga/Documents/obsidian/private_vault"]
trust_level = "trusted"

[projects."/Users/momonga/Documents/blog"]
trust_level = "trusted"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[plugins."atlassian-rovo@openai-curated"]
enabled = true

