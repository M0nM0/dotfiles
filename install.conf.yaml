- defaults:
    link:
      relink: true
      force: true
      create: true

- clean: ['~']

- link:
    ~/.zshrc:
      path: zsh/.zshrc
    ~/.tmux:
      path: tmux
    ~/.tmux.conf:
      path: tmux/.tmux.conf
    ~/.fzf.zsh:
      path: fzf/.fzf.zsh
    ~/.config/sheldon:
      path: sheldon
    ~/.config/wezterm:
      path: wezterm
    ~/.config/starship.toml:
      path: starship.toml
    ~/.config/nvim:
      path: nvim
      force: true
    ~/.config/git:
      path: git
    ~/.config/lazygit:
      path: lazygit
    ~/.config/gh/config.yml:
      path: gh/config.yml
    ~/.config/karabiner:
      path: karabiner
    ~/.config/direnv:
      path: direnv
    ~/.envrc:
      path: .envrc
    ~/.tool-versions:
      path: .tool-versions

- create:
    - ~/.config

- shell:
  - [git submodule update --init dotbot, Installing dotbot]
  - [git submodule update --init nvim && git -C nvim checkout main, Installing nvim]
