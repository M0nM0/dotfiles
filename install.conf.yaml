- defaults:
    link:
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.zshrc:
      path: zsh/.zshrc
    ~/.tmux:
      path: tmux
    ~/.tmux.conf:
      path: tmux/.tmux.conf
    ~/.fzf.zsh:
      path: fzf/.fzf.zsh
    ~/.gitconfig:
      path: .gitconfig
    ~/.latexindent.yaml:
      path: latex/.latexindent.yaml
    ~/.config/sheldon:
      path: sheldon
    ~/.config/wezterm:
      path: wezterm
    ~/.config/starship.toml:
      path: starship.toml
    ~/.config/nvim:
      path: nvim
      force: true
    ~/.config/git/ignore:
      path: git/ignore
    ~/.config/lazygit/config.yml:
      path: lazygit/config.yml
    ~/.config/gh/config.yml:
      path: gh/config.yml
    ~/.config/karabiner/karabiner.json:
      path: karabiner/karabiner.json
    ~/.config/direnv:
      path: direnv
    ~/.envrc:
      path: .envrc

- create:
    - ~/.config

- shell:
  - [git submodule update --init --recursive --remote && git -C nvim checkout main, Installing submodules]
  - ["[ ! -d tmux/plugins/tpm ] && git clone https://github.com/tmux-plugins/tpm tmux/plugins/tpm || true", Installing tpm]
  - ["~/.tmux/plugins/tpm/bin/install_plugins", Installing tmux plugins]
